<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Browser</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="browser-container">
      <div class="title-bar">
        <div class="title-bar-drag-region"></div>
      </div>

      <div class="tab-bar" id="tabBar">
        <div class="tab-list" id="tabList"></div>
        <button class="new-tab-btn" id="newTabBtn" title="New Tab (right-click for Private Tab)">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M7 2 L7 12 M2 7 L12 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
        <!-- Right-click context menu for new tab button -->
        <div class="new-tab-menu" id="newTabMenu" aria-hidden="true">
          <button class="new-tab-menu-item" id="newTabMenuItem">New Tab</button>
          <button class="new-tab-menu-item private" id="newPrivateTabMenuItem">
            <svg width="12" height="12" viewBox="0 0 16 16" fill="none">
              <path d="M8 1L2 4v4c0 3.5 2.5 6.5 6 7.5C11.5 14.5 14 11.5 14 8V4L8 1z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
            </svg>
            New Private Window
          </button>
        </div>
      </div>

      <!-- Private window banner (shown only in private windows via JS) -->
      <div class="private-window-banner" id="privateWindowBanner" hidden>
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none">
          <path d="M8 1L2 4v4c0 3.5 2.5 6.5 6 7.5C11.5 14.5 14 11.5 14 8V4L8 1z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
        </svg>
        Private Window — browsing activity won't be saved
      </div>

      <!-- Toolbar -->
      <div class="toolbar">
        <div class="toolbar-row">
        <div class="nav-buttons">
          <button class="nav-btn" id="backBtn" title="Back" disabled>
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path d="M10 12 L6 8 L10 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <button class="nav-btn" id="forwardBtn" title="Forward" disabled>
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path d="M6 12 L10 8 L6 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <button class="nav-btn" id="reloadBtn" title="Reload">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path d="M13.5 8C13.5 11.0376 11.0376 13.5 8 13.5M2.5 8C2.5 4.96243 4.96243 2.5 8 2.5M8 2.5L8 5.5M8 13.5L8 10.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </button>
        </div>

        <div class="address-bar-container">
          <div class="address-bar" id="addressBar">
            <svg class="address-bar-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
              <circle cx="8" cy="8" r="3" stroke="currentColor" stroke-width="1.5"/>
              <path d="M8 1 L8 3 M8 13 L8 15 M1 8 L3 8 M13 8 L15 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <div class="private-badge" id="privateBadge" style="display:none;">
              <svg width="11" height="11" viewBox="0 0 16 16" fill="none">
                <path d="M8 1L2 4v4c0 3.5 2.5 6.5 6 7.5C11.5 14.5 14 11.5 14 8V4L8 1z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
              </svg>
              Private
            </div>
            <input 
              type="text" 
              id="addressInput" 
              class="address-input" 
              placeholder="Search or enter website name"
              spellcheck="false"
            />
            <div class="loading-indicator" id="loadingIndicator" style="display: none;">
              <div class="spinner"></div>
            </div>
          </div>
        </div>
        <div class="toolbar-right">
          <button class="nav-btn" id="sidebarToggle" title="Toggle Sidebar">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path d="M2 4 L14 4 M2 8 L14 8 M2 12 L14 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </button>
          <button class="nav-btn settings-btn" id="settingsBtn" title="Settings / Saved passwords">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
          </button>
        </div>
        </div>
        <div class="find-bar" id="findBar" hidden>
          <input type="text" id="findInput" class="find-input" placeholder="Find in page" />
          <button type="button" class="find-close-btn" id="findCloseBtn" title="Close (Escape)">×</button>
        </div>
      </div>

      <!-- Sidebar -->
      <div class="sidebar" id="sidebar">
        <div class="sidebar-resize-handle" id="sidebarResizeHandle"></div>
        <div class="sidebar-header">
          <h3>AI Agent</h3>
          <div class="sidebar-header-actions">
            <select id="modelSelect" class="model-select" title="AI model">
              <option value="gemini">Gemini</option>
              <option value="gpt">GPT</option>
              <option value="claude">Claude</option>
            </select>
            <button class="sidebar-close" id="sidebarCloseBtn">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <path d="M4 4 L12 12 M12 4 L4 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="reference-container" id="referenceContainer"></div>
        <div class="chat-input-container">
          <textarea
            id="chatInput"
            class="chat-input"
            placeholder="What should I do?"
            spellcheck="true"
            rows="2"
          ></textarea>
          <button class="chat-send-btn" id="chatSendBtn" title="Send">
            <span class="chat-send-icon">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <path d="M2 8 L14 8 M9 3 L14 8 L9 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
            <span class="chat-stop-icon" style="display: none;">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor">
                <rect x="2" y="2" width="10" height="10" rx="2"/>
              </svg>
            </span>
          </button>
        </div>
      </div>
    </div>

    <div class="agent-border-overlay" id="agentBorderOverlay"></div>
    <div class="agent-toast" id="agentToast">Tab controlled by AI Assistant</div>

    <!-- Settings modal: saved passwords -->
    <div class="settings-overlay" id="settingsOverlay" aria-hidden="true">
      <div class="settings-modal" id="settingsModal">
        <div class="settings-header">
          <h2 class="settings-title">Settings</h2>
          <button class="settings-close" id="settingsCloseBtn" title="Close">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <div class="settings-tabs">
          <button class="settings-tab active" data-tab="passwords">Saved passwords</button>
        </div>
        <div class="settings-content" id="settingsContent">
          <div class="settings-section" id="passwordsSection">
            <p class="settings-section-desc">Logins saved when you use “Save & Sign In” on sites.</p>
            <div class="saved-logins-list" id="savedLoginsList"></div>
            <p class="settings-empty" id="savedLoginsEmpty">No saved passwords yet.</p>
          </div>
        </div>
      </div>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
