<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Browser</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="browser-container">
      <div class="title-bar">
        <div class="title-bar-drag-region"></div>
      </div>

      <div class="tab-bar" id="tabBar">
        <div class="tab-list" id="tabList"></div>
        <button class="new-tab-btn" id="newTabBtn" title="New Tab">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M7 2 L7 12 M2 7 L12 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
      </div>

      <!-- Toolbar -->
      <div class="toolbar">
        <div class="nav-buttons">
          <button class="nav-btn" id="sidebarToggle" title="Toggle Sidebar">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path d="M2 4 L14 4 M2 8 L14 8 M2 12 L14 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </button>
          <button class="nav-btn" id="backBtn" title="Back" disabled>
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path d="M10 12 L6 8 L10 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <button class="nav-btn" id="forwardBtn" title="Forward" disabled>
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path d="M6 12 L10 8 L6 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <button class="nav-btn" id="reloadBtn" title="Reload">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path d="M13.5 8C13.5 11.0376 11.0376 13.5 8 13.5M2.5 8C2.5 4.96243 4.96243 2.5 8 2.5M8 2.5L8 5.5M8 13.5L8 10.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </button>
        </div>

        <div class="address-bar-container">
          <div class="address-bar">
            <svg class="address-bar-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
              <circle cx="8" cy="8" r="3" stroke="currentColor" stroke-width="1.5"/>
              <path d="M8 1 L8 3 M8 13 L8 15 M1 8 L3 8 M13 8 L15 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <input 
              type="text" 
              id="addressInput" 
              class="address-input" 
              placeholder="Search or enter website name"
              spellcheck="false"
            />
            <div class="loading-indicator" id="loadingIndicator" style="display: none;">
              <div class="spinner"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Sidebar -->
      <div class="sidebar" id="sidebar">
        <div class="sidebar-resize-handle" id="sidebarResizeHandle"></div>
        <div class="sidebar-header">
          <h3>AI Agent</h3>
          <div class="sidebar-header-actions">
            <select id="modelSelect" class="model-select" title="AI model">
              <option value="gemini">Gemini</option>
              <option value="gpt">GPT</option>
              <option value="claude">Claude</option>
            </select>
            <button class="sidebar-close" id="sidebarCloseBtn">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <path d="M4 4 L12 12 M12 4 L4 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="reference-container" id="referenceContainer"></div>
        <div class="chat-input-container">
          <textarea
            id="chatInput"
            class="chat-input"
            placeholder="What should I do?"
            spellcheck="true"
            rows="2"
          ></textarea>
          <button class="chat-send-btn" id="chatSendBtn" title="Send">
            <span class="chat-send-icon">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <path d="M2 8 L14 8 M9 3 L14 8 L9 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
            <span class="chat-stop-icon" style="display: none;">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor">
                <rect x="2" y="2" width="10" height="10" rx="2"/>
              </svg>
            </span>
          </button>
        </div>
      </div>
    </div>

    <div class="agent-border-overlay" id="agentBorderOverlay"></div>
    <div class="agent-toast" id="agentToast">Tab controlled by AI Assistant</div>

    <script src="renderer.js"></script>
  </body>
</html>
